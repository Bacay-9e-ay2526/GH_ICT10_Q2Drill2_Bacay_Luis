<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <title>2nd Quarter | Drill 2</title>
</head>
<body class="bg-dark text-light">
    <div class="container mt-5">
        <h3 class="mb-4 text-info">Add new club member:</h3>
        
        <!-- Registration Form -->
        <form class="mb-4 p-4 border border-secondary rounded bg-secondary bg-opacity-10 shadow-sm">
            <div class="mb-3">
                <input type="text" id="fname_input" class="form-control bg-dark text-light border-secondary" placeholder="Enter the first name">
            </div>
            <div class="mb-3">
                <input type="text" id="lname_input" class="form-control bg-dark text-light border-secondary" placeholder="Enter the last name">
            </div>
            <input type="button" value="Submit" py-click="process_registration" class="btn btn-info w-100 fw-bold">
        </form>
        
        <!-- Member Roster Display Box (Sleek Dark Slate & Cyan Theme) -->
        <div id="roster_box" class="p-4 rounded shadow border border-info" style="background-color: #0f172a; color: #38bdf8; font-size: 20px;"></div>
    </div>

    <!-- PyScript Main File -->
    <py-script src="main.py"></py-script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
